name: Windows

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (x64)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      QT_VERSION: 6.11.2
      AQTINSTALL_COMMIT: 076e1659807d0b362a3ed684d54c2e9c775eb9c7
      CLI11_TAG: v2.5.0

    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Paths
        run: |
          tmp="$(cygpath -m "$RUNNER_TEMP")"
          {
            echo "QT_ROOT=$tmp/qt"
            echo "QT_WIN=$tmp/qt/$QT_VERSION/msvc2022_64"
            echo "CLI11_DIR=$tmp/cli11"
          } >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: python -m pip install --quiet "aqtinstall @ git+https://github.com/miurahr/aqtinstall@$AQTINSTALL_COMMIT" ninja

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-msvc2022_64-qt5compat-qtimageformats-qtpositioning-qtshadertools

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: aqt install-qt windows desktop "$QT_VERSION" win64_msvc2022_64 -m qt5compat qtimageformats qtpositioning qtshadertools -O "$QT_ROOT"

      - name: CLI11
        run: git clone -q --depth 1 --branch "$CLI11_TAG" https://github.com/CLIUtils/CLI11.git "$CLI11_DIR"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_PREFIX_PATH="$QT_WIN" -DCLI11_INCLUDE_DIR="$CLI11_DIR/include"
          cmake --build build

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S src/windows/test -B build/windows-test -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_PREFIX_PATH="$QT_WIN"
          cmake --build build/windows-test
          export PATH="$(cygpath -u "$QT_WIN")/bin:$PATH"
          for test in tiling_layout_test screenshot_jobs_test panel_animation_test; do
            echo "== $test"
            "build/windows-test/$test.exe"
          done
